# Empaquetage de Jaris en un installeur Windows unique (étape 16 du roadmap).
#
# Objectif de l'étape : un seul `.exe` téléchargé et double-cliqué, comme n'importe quel vrai logiciel
# Windows — aucune commande à taper, aucun terminal à ouvrir, aucun fichier de configuration à remplir.
# Tout ce qui est encore trop gros pour tenir dans l'installeur (Python et ses dépendances, Ollama, les
# modèles) est installé par l'application elle-même au premier lancement, jamais par l'utilisateur.
appId: com.jaris.assistant
productName: Jaris
copyright: Jaris

directories:
  output: release
  buildResources: build

# Le code compilé de l'app (out/) et le manifeste dont Electron a besoin pour trouver son point d'entrée.
# Le reste du dépôt (sources TypeScript, scripts de dev, README...) n'a rien à faire dans l'installeur.
files:
  - out/**
  - package.json

# Les sidecars Python sont lancés comme de vrais process externes (`python voice_server.py`) : ils doivent
# rester de VRAIS fichiers sur le disque, à côté de l'application, et surtout pas être empaquetés dans
# l'archive `app.asar` — un fichier à l'intérieur d'un asar n'existe pas pour un programme extérieur à
# Electron (voir electron/paths.ts, qui résout ce dossier selon dev/production).
extraResources:
  - from: python
    to: python
    filter:
      - '**/*.py'
      - 'models/*.onnx'
      - requirements.txt
  # Scores de fiabilité des modèles, lus à l'exécution pour choisir quel modèle installer sur cette
  # machine (voir parseVerifiedToolScores, hardwareScan.ts). Sans ce fichier, plus aucun candidat n'a de
  # score connu : le choix retombe sur "le plus gros modèle qui tient en VRAM", sans considération de sa
  # fiabilité en appels d'outils — exactement la version dégradée que l'étape 16 interdit.
  #
  # benchmark-models.mjs (le vrai script d'analyse comparative, "Tester tous les modèles et choisir les
  # meilleurs" dans Options → Modèles) : ne dépend que de modules natifs Node (aucun node_modules à
  # embarquer, voir benchmarkRunner.ts) — mais était ABSENT d'ici jusqu'à cette ligne, alors que le bouton
  # qui le lance existe dans l'appli installée : `spawn`ait un fichier inexistant, échec immédiat avec le
  # code 1 (jamais vu en dev, où le script est bien là dans le dépôt).
  - from: scripts
    to: scripts
    filter:
      - verified-tool-scores.md
      - benchmark-models.mjs
  # Recherche web : la configuration du conteneur SearXNG. Docker Desktop ne s'installe pas en silence,
  # donc la recherche web reste indisponible sur une machine qui ne l'a pas (voir README) — mais sur une
  # machine qui l'a déjà, il ne manquait que ces fichiers pour que ça marche.
  - from: docker-compose.yml
    to: docker-compose.yml
  - from: searxng
    to: searxng

win:
  target: nsis
  icon: build/icon.ico

nsis:
  # Étape 142, Léo : "pouvoir choisir le dossier où mettre Jaris quand tu l'installes la première fois". Un
  # installeur "un clic" (oneClick: true, choix de l'étape 16) n'a AUCUN écran : il installe toujours dans
  # %LOCALAPPDATA%\Programs, sans rien demander. Seul l'installeur assisté d'electron-builder propose l'écran
  # "Dossier d'installation" (allowToChangeInstallationDirectory). Il n'apparaît qu'à la PREMIÈRE
  # installation : les mises à jour lancées depuis Jaris passent `/S --updated --force-run` (appUpdater.ts),
  # donc restent silencieuses, réutilisent le dossier déjà choisi (InstallLocation, lu dans le registre par
  # l'installeur lui-même) et relancent Jaris à la fin, comme avant.
  oneClick: false
  allowToChangeInstallationDirectory: true
  # Installation pour l'utilisateur courant par défaut (%LOCALAPPDATA%\Programs) : pas d'invite d'élévation
  # Windows (UAC). L'installeur assisté affiche aussi le choix "Pour moi seulement / Pour tous les
  # utilisateurs" (seul "tous" demande l'UAC) — electron-builder ne permet pas de garder le choix du dossier
  # sans cet écran, sauf à imposer une installation pour toute la machine, avec UAC à chaque mise à jour.
  perMachine: false
  createDesktopShortcut: always
  createStartMenuShortcut: true
  runAfterFinish: true
  shortcutName: Jaris
  artifactName: Jaris-Setup-${version}.exe
  # Étape 148 : nettoyage avant la désinstallation de l'ancienne version (conteneur SearXNG et programmes Python
  # de la voix qui gardaient le dossier du programme occupé — erreur « Échec de désinstallation… : 2 »).
  include: installer/jaris.nsh
