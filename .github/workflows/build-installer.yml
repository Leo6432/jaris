# Construit l'installeur Windows de Jaris (étape 16) sur les serveurs de GitHub, pas sur une machine de
# développement : c'est ce qui permet de récupérer un Jaris-Setup.exe prêt à installer sans avoir Node,
# npm ni quoi que ce soit d'installé sur le PC qui va s'en servir.
name: Installeur Windows

on:
  push:
    branches:
      - main
      - 'claude/**'
    # Un tag de version (ex: v0.1.0) publie en plus une vraie Release GitHub, voir le dernier bloc.
    tags:
      - 'v*'
  # Permet aussi de relancer une construction à la demande depuis l'onglet Actions de GitHub, sans avoir
  # à pousser un commit juste pour ça.
  workflow_dispatch:

jobs:
  build:
    # Obligatoirement Windows : un installeur NSIS ne se construit pas sur Linux sans émulation.
    runs-on: windows-latest
    permissions:
      # Nécessaire uniquement pour l'étape de publication de Release ci-dessous (création d'un tag/asset).
      contents: write

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      # `npm ci` (et pas `npm install`) : installe exactement les versions de package-lock.json, pour que
      # l'installeur publié soit construit avec les mêmes dépendances que celles testées.
      - run: npm ci

      # Le même contrôle de types que celui lancé à la main pendant le développement : mieux vaut échouer
      # ici que publier un installeur qui plante au lancement.
      - run: npm run typecheck

      # Les identifiants Google sont figés dans la construction (voir `define` dans
      # electron.vite.config.ts) : sans eux, l'application installée ne peut pas connecter de compte Gmail,
      # puisqu'elle n'a aucun .env où les lire. À renseigner une seule fois dans Settings → Secrets and
      # variables → Actions du dépôt ; s'ils sont absents, le build réussit quand même et Jaris explique
      # simplement que l'envoi de mails n'est pas disponible dans cette version.
      - run: npm run dist
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}

      # Récupérable depuis l'onglet Actions de GitHub, sur chaque commit poussé : c'est le moyen le plus
      # rapide de tester une version en cours de développement sur un vrai PC Windows.
      - uses: actions/upload-artifact@v4
        with:
          name: Jaris-Setup
          path: release/Jaris-Setup-*.exe
          if-no-files-found: error

      # Sur un tag de version : publie le .exe en Release nommée d'après le tag (ex: v0.1.0), une vraie
      # sortie versionnée avec ses notes.
      - if: startsWith(github.ref, 'refs/tags/v')
        run: |
          $exe = (Get-Item release/Jaris-Setup-*.exe).FullName
          gh release create "$env:GITHUB_REF_NAME" "$exe" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}

      # Sur chaque push de branche (pas les tags, déjà couverts ci-dessus) : republie systématiquement une
      # Release "dernier-build", écrasée à chaque fois (--clobber). Contrairement à un artefact (.zip, lien
      # qui change à chaque run), ça donne un lien de téléchargement STABLE et direct vers le .exe, sans
      # jamais avoir à créer un tag à la main pour tester une version en cours de développement.
      - if: github.ref_type == 'branch'
        run: |
          $exe = (Get-Item release/Jaris-Setup-*.exe).FullName
          gh release delete dernier-build --yes 2>$null
          gh release create dernier-build "$exe" --title "Dernier build (${env:GITHUB_REF_NAME})" --notes "Construit automatiquement depuis le commit ${env:GITHUB_SHA} — pas une version stable, remplacé à chaque push." --prerelease
        env:
          GH_TOKEN: ${{ github.token }}

      # Publie automatiquement une VRAIE Release stable dès que le champ `version` de package.json ne
      # correspond à aucune Release déjà publiée — personne, pas même le développeur, ne tape jamais
      # `git tag` à la main (un push de tag reste possible ci-dessus, mais n'est plus nécessaire) : bumper
      # `version` dans package.json puis pousser suffit, sur n'importe quelle branche. Idempotent : si la
      # Release existe déjà (ex: un deuxième commit sans changement de version), `gh release view` réussit
      # et on ne fait rien.
      - if: github.ref_type == 'branch'
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $tag = "v$version"
          $exe = (Get-Item release/Jaris-Setup-*.exe).FullName
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag déjà publiée, rien à faire."
          } else {
            gh release create $tag "$exe" --title $tag --generate-notes --target $env:GITHUB_SHA
          }
        env:
          GH_TOKEN: ${{ github.token }}
