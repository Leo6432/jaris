# Construit l'installeur Windows de Jaris (étape 16) sur les serveurs de GitHub, pas sur une machine de
# développement : c'est ce qui permet de récupérer un Jaris-Setup.exe prêt à installer sans avoir Node,
# npm ni quoi que ce soit d'installé sur le PC qui va s'en servir.
name: Installeur Windows

on:
  push:
    branches:
      - main
      - 'claude/**'
    # Un tag de version (ex: v0.1.0) publie en plus une vraie Release GitHub, voir le dernier bloc.
    tags:
      - 'v*'
  # Permet aussi de relancer une construction à la demande depuis l'onglet Actions de GitHub, sans avoir
  # à pousser un commit juste pour ça.
  workflow_dispatch:

jobs:
  build:
    # Obligatoirement Windows : un installeur NSIS ne se construit pas sur Linux sans émulation.
    runs-on: windows-latest
    permissions:
      # Nécessaire uniquement pour l'étape de publication de Release ci-dessous (création d'un tag/asset).
      contents: write

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      # `npm ci` (et pas `npm install`) : installe exactement les versions de package-lock.json, pour que
      # l'installeur publié soit construit avec les mêmes dépendances que celles testées.
      - run: npm ci

      # Le même contrôle de types que celui lancé à la main pendant le développement : mieux vaut échouer
      # ici que publier un installeur qui plante au lancement.
      - run: npm run typecheck

      # Les tests de régression écrits au fil des correctifs (scripts/test-*.mjs) n'étaient jusqu'ici lancés
      # qu'à la main : rien n'empêchait de publier un installeur qui les casse. Ils sont rapides (quelques
      # secondes, aucun service externe requis) et servent justement à ne pas refaire les bugs déjà corrigés.
      - run: npm test

      - run: npm run dist

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Vérifie le détecteur vocal réellement empaqueté
        run: |
          python -m pip install numpy==2.4.6
          python scripts/test-wake-confirmation.py
          python scripts/check-packaged-voice.py release/win-unpacked/resources/python

      # Étape 45 : lance vraiment l'appli packagée (pas l'unpacked, avant l'installeur NSIS) pour attraper un
      # plantage au démarrage AVANT de publier une Release — sans ce test, une régression qui empêche Jaris
      # de s'ouvrir (dépendance native manquante, exception non rattrapée dans app.whenReady()...) n'était
      # découverte qu'en usage réel, bien après la publication. Aucun service externe requis pour ce test
      # (Ollama/Docker/SearXNG) : le démarrage de Jaris est déjà conçu pour continuer même s'ils manquent
      # (voir dependencyServices.ts) et afficher sa fenêtre d'onboarding dans tous les cas.
      - name: Vérifie que l'appli packagée démarre sans planter
        shell: pwsh
        run: |
          $exe = "release\win-unpacked\Jaris.exe"
          if (-not (Test-Path $exe)) { throw "Exécutable introuvable : $exe" }
          $proc = Start-Process -FilePath $exe -WindowStyle Hidden -PassThru
          Start-Sleep -Seconds 15
          $stillRunning = Get-Process -Id $proc.Id -ErrorAction SilentlyContinue
          if (-not $stillRunning) {
            throw "Jaris s'est fermé tout seul dans les 15 secondes suivant son lancement (code de sortie $($proc.ExitCode)) : plantage au démarrage."
          }
          Write-Host "Jaris tourne toujours après 15s, aucun plantage détecté."
          Stop-Process -Id $proc.Id -Force

      # Étape 189 : le paquet Montage (Remotion, installé seulement si Léo le demande). Construit ici, sur
      # Windows, pour embarquer les programmes Windows de Remotion (compositeur + FFmpeg, esbuild, rspack) ;
      # les versions exactes viennent de montage/package-lock.json. Puis une VRAIE vidéo est fabriquée avec le
      # Node de Jaris.exe (ELECTRON_RUN_AS_NODE), exactement comme sur le PC de Léo : un paquet qui ne sait pas
      # filmer n'est jamais publié.
      - name: Construit et vérifie le paquet Montage (Remotion)
        shell: pwsh
        run: |
          Push-Location montage
          npm ci --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw "npm ci du paquet Montage a échoué" }
          $version = (Get-Content package.json | ConvertFrom-Json).dependencies.remotion
          Pop-Location
          $asset = "Jaris-Montage-remotion-$version.zip"
          $packDir = Join-Path $env:RUNNER_TEMP "montage-pack"
          New-Item -ItemType Directory -Force -Path $packDir | Out-Null
          Copy-Item montage/package.json $packDir
          Move-Item montage/node_modules (Join-Path $packDir "node_modules")
          tar.exe -a -c -f "release/$asset" -C $packDir package.json node_modules
          if ($LASTEXITCODE -ne 0) { throw "compression du paquet Montage impossible" }
          Write-Host "Paquet : $asset ($([math]::Round((Get-Item "release/$asset").Length / 1MB)) Mo)"

          $env:ELECTRON_RUN_AS_NODE = "1"
          $exe = (Resolve-Path "release\win-unpacked\Jaris.exe").Path
          $runner = (Resolve-Path "release\win-unpacked\resources\montage\render.cjs").Path
          $nodeModules = Join-Path $packDir "node_modules"
          $jobs = Join-Path $env:RUNNER_TEMP "montage-jobs"
          New-Item -ItemType Directory -Force -Path $jobs | Out-Null
          @{ action = "ensure-browser"; nodeModules = $nodeModules } | ConvertTo-Json | Set-Content -Encoding utf8 "$jobs/browser.json"
          Push-Location $packDir
          & $exe $runner "$jobs/browser.json" | Select-Object -Last 2
          if ($LASTEXITCODE -ne 0) { throw "le navigateur de rendu n'a pas pu être téléchargé" }
          $project = Join-Path $env:RUNNER_TEMP "montage-project"
          New-Item -ItemType Directory -Force -Path $project | Out-Null
          Copy-Item "$env:GITHUB_WORKSPACE/scripts/fixtures/montage/*.tsx" $project
          $video = Join-Path $project "video.mp4"
          @{ action = "render"; nodeModules = $nodeModules; projectDir = $project; output = $video } | ConvertTo-Json | Set-Content -Encoding utf8 "$jobs/render.json"
          & $exe $runner "$jobs/render.json" | Select-Object -Last 2
          if ($LASTEXITCODE -ne 0) { throw "Remotion n'a pas réussi à fabriquer la vidéo de test" }
          Pop-Location
          $size = (Get-Item $video).Length
          if ($size -lt 10000) { throw "vidéo de test trop petite ($size octets)" }
          Write-Host "Vidéo de test fabriquée : $size octets."

          # Étape 190 : monter une VRAIE vidéo sur Windows — durée lue par le compositeur, puis coupée avec
          # OffthreadVideo et un texte par-dessus (le chemin exact d'une vidéo que Léo joint au Montage).
          @{ action = "probe"; nodeModules = $nodeModules; files = @($video) } | ConvertTo-Json | Set-Content -Encoding utf8 "$jobs/probe.json"
          Push-Location $packDir
          $probe = & $exe $runner "$jobs/probe.json" | Where-Object { $_ -match '"metadata"' } | ConvertFrom-Json
          Pop-Location
          $duration = $probe.items[0].durationInSeconds
          if ([math]::Abs($duration - 2) -gt 0.2) { throw "durée lue sur la vidéo de test : $duration s (2 s attendues)" }
          $clipProject = Join-Path $env:RUNNER_TEMP "montage-clip-project"
          New-Item -ItemType Directory -Force -Path (Join-Path $clipProject "public") | Out-Null
          Copy-Item "$env:GITHUB_WORKSPACE/scripts/fixtures/montage-clip/*.tsx" $clipProject
          Copy-Item $video (Join-Path $clipProject "public/clip1.mp4")
          $edited = Join-Path $clipProject "video.mp4"
          @{ action = "render"; nodeModules = $nodeModules; projectDir = $clipProject; output = $edited } | ConvertTo-Json | Set-Content -Encoding utf8 "$jobs/render-clip.json"
          Push-Location $packDir
          & $exe $runner "$jobs/render-clip.json" | Select-Object -Last 2
          if ($LASTEXITCODE -ne 0) { throw "Remotion n'a pas réussi à monter la vidéo de test" }
          Pop-Location
          Write-Host "Vidéo montée (coupée + texte) : $((Get-Item $edited).Length) octets."
          Remove-Item Env:ELECTRON_RUN_AS_NODE

      # Récupérable depuis l'onglet Actions de GitHub, sur chaque commit poussé : c'est le moyen le plus
      # rapide de tester une version en cours de développement sur un vrai PC Windows.
      - uses: actions/upload-artifact@v4
        with:
          name: Jaris-Setup
          path: release/Jaris-Setup-*.exe
          if-no-files-found: error

      # Sur un tag de version : publie le .exe en Release nommée d'après le tag (ex: v0.1.0), une vraie
      # sortie versionnée avec ses notes.
      - if: startsWith(github.ref, 'refs/tags/v')
        run: |
          $exe = (Get-Item release/Jaris-Setup-*.exe).FullName
          $pack = (Get-Item release/Jaris-Montage-*.zip).FullName
          gh release create "$env:GITHUB_REF_NAME" "$exe" "$pack" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}

      # Sur chaque push de branche (pas les tags, déjà couverts ci-dessus) : republie systématiquement une
      # Release "dernier-build", écrasée à chaque fois (--clobber). Contrairement à un artefact (.zip, lien
      # qui change à chaque run), ça donne un lien de téléchargement STABLE et direct vers le .exe, sans
      # jamais avoir à créer un tag à la main pour tester une version en cours de développement.
      - if: github.ref_type == 'branch'
        run: |
          $exe = (Get-Item release/Jaris-Setup-*.exe).FullName
          gh release delete dernier-build --yes 2>$null
          gh release create dernier-build "$exe" --title "Dernier build (${env:GITHUB_REF_NAME})" --notes "Construit automatiquement depuis le commit ${env:GITHUB_SHA} — pas une version stable, remplacé à chaque push." --prerelease
        env:
          GH_TOKEN: ${{ github.token }}

      # Publie automatiquement une VRAIE Release stable dès que le champ `version` de package.json ne
      # correspond à aucune Release déjà publiée — personne, pas même le développeur, ne tape jamais
      # `git tag` à la main (un push de tag reste possible ci-dessus, mais n'est plus nécessaire) : bumper
      # `version` dans package.json puis pousser suffit, sur n'importe quelle branche. Idempotent : si la
      # Release existe déjà (ex: un deuxième commit sans changement de version), `gh release view` réussit
      # et on ne fait rien.
      - if: github.ref_type == 'branch'
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $tag = "v$version"
          $exe = (Get-Item release/Jaris-Setup-*.exe).FullName
          $pack = (Get-Item release/Jaris-Montage-*.zip).FullName
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag déjà publiée, rien à faire."
          } else {
            # Le paquet Montage accompagne chaque version : Jaris le cherche dans la Release de SA version.
            gh release create $tag "$exe" "$pack" --title $tag --generate-notes --target $env:GITHUB_SHA
          }
        env:
          GH_TOKEN: ${{ github.token }}
