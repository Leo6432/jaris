# Construit l'installeur Windows de Jaris (étape 16) sur les serveurs de GitHub, pas sur une machine de
# développement : c'est ce qui permet de récupérer un Jaris-Setup.exe prêt à installer sans avoir Node,
# npm ni quoi que ce soit d'installé sur le PC qui va s'en servir.
name: Installeur Windows

on:
  push:
    branches:
      - main
      - 'claude/**'
    # Un tag de version (ex: v0.1.0) publie en plus une vraie Release GitHub, voir le dernier bloc.
    tags:
      - 'v*'
  # Permet aussi de relancer une construction à la demande depuis l'onglet Actions de GitHub, sans avoir
  # à pousser un commit juste pour ça.
  workflow_dispatch:

jobs:
  build:
    # Obligatoirement Windows : un installeur NSIS ne se construit pas sur Linux sans émulation.
    runs-on: windows-latest
    permissions:
      # Nécessaire uniquement pour l'étape de publication de Release ci-dessous (création d'un tag/asset).
      contents: write

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      # `npm ci` (et pas `npm install`) : installe exactement les versions de package-lock.json, pour que
      # l'installeur publié soit construit avec les mêmes dépendances que celles testées.
      - run: npm ci

      # Le même contrôle de types que celui lancé à la main pendant le développement : mieux vaut échouer
      # ici que publier un installeur qui plante au lancement.
      - run: npm run typecheck

      # Les tests de régression écrits au fil des correctifs (scripts/test-*.mjs) n'étaient jusqu'ici lancés
      # qu'à la main : rien n'empêchait de publier un installeur qui les casse. Ils sont rapides (quelques
      # secondes, aucun service externe requis) et servent justement à ne pas refaire les bugs déjà corrigés.
      - run: npm test

      # Étape 214 : le tunnel du téléphone (Tailscale embarqué, tunnel/main.go), testé puis compilé ici et
      # inclus dans l'installeur (electron-builder.yml). La version de Go suit tunnel/go.mod.
      - uses: actions/setup-go@v5
        with:
          go-version-file: tunnel/go.mod
          cache-dependency-path: tunnel/go.sum

      # Étape 289 : la cause des modèles « introuvables » après la mise à jour d'Ollama, vérifiée sur un vrai Windows
      # (Go ne traverse plus une jonction). Voir scripts/junction-check/main.go et ollamaModelsVariable.ts.
      - name: Vérifie la lecture d'un modèle à travers une jonction
        working-directory: scripts/junction-check
        run: go run .

      # Une commande par étape : dans un bloc PowerShell, l'échec d'une commande au milieu ne fait pas
      # forcément échouer l'étape (seul le code de sortie de la dernière compte).
      - name: Vérifie le tunnel du téléphone
        working-directory: tunnel
        run: go vet ./...

      - name: Teste le tunnel du téléphone
        working-directory: tunnel
        run: go test ./...

      - name: Compile le tunnel du téléphone
        working-directory: tunnel
        run: go build -trimpath -ldflags "-s -w" -o dist/jaris-tunnel.exe .

      - run: npm run dist

      # Un fichier manquant dans extraResources ne fait pas échouer electron-builder : on vérifie nous-mêmes que
      # le tunnel et la page du téléphone sont bien dans l'installeur, sinon l'onglet Téléphone serait inutilisable.
      - name: Vérifie que le module téléphone est empaqueté
        shell: pwsh
        run: |
          foreach ($f in @('release\win-unpacked\resources\bin\jaris-tunnel.exe', 'release\win-unpacked\resources\phone\index.html', 'release\win-unpacked\resources\phone\app.js', 'release\win-unpacked\resources\phone\sw.js', 'release\win-unpacked\resources\build\icon.ico')) {
            if (-not (Test-Path $f)) { throw "Absent de l'installeur : $f" }
          }
          Write-Host "Module téléphone présent."

      # Étape 221 : le bouton « Tester les modèles sans score » lance ces deux fichiers depuis l'appli installée.
      - name: Vérifie que le test des modèles est empaqueté
        shell: pwsh
        run: |
          foreach ($f in @('release\win-unpacked\resources\scripts\benchmark-models.mjs', 'release\win-unpacked\resources\scripts\benchmark-cases.mjs', 'release\win-unpacked\resources\scripts\verified-tool-scores.md')) {
            if (-not (Test-Path $f)) { throw "Absent de l'installeur : $f" }
          }
          Write-Host "Test des modèles présent."

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Vérifie le détecteur vocal réellement empaqueté
        run: |
          python -m pip install numpy==2.4.6
          python scripts/test-wake-confirmation.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python scripts/test-phone-wav.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python scripts/check-packaged-voice.py release/win-unpacked/resources/python

      # Étape 45 : lance vraiment l'appli packagée (pas l'unpacked, avant l'installeur NSIS) pour attraper un
      # plantage au démarrage AVANT de publier une Release — sans ce test, une régression qui empêche Jaris
      # de s'ouvrir (dépendance native manquante, exception non rattrapée dans app.whenReady()...) n'était
      # découverte qu'en usage réel, bien après la publication. Aucun service externe requis pour ce test
      # (Ollama, recherche web) : le démarrage de Jaris est déjà conçu pour continuer même s'ils manquent
      # (voir dependencyServices.ts) et afficher sa fenêtre d'onboarding dans tous les cas.
      - name: Vérifie que l'appli packagée démarre sans planter
        shell: pwsh
        run: |
          $exe = "release\win-unpacked\Jaris.exe"
          if (-not (Test-Path $exe)) { throw "Exécutable introuvable : $exe" }
          $proc = Start-Process -FilePath $exe -WindowStyle Hidden -PassThru
          Start-Sleep -Seconds 15
          $stillRunning = Get-Process -Id $proc.Id -ErrorAction SilentlyContinue
          if (-not $stillRunning) {
            throw "Jaris s'est fermé tout seul dans les 15 secondes suivant son lancement (code de sortie $($proc.ExitCode)) : plantage au démarrage."
          }
          Write-Host "Jaris tourne toujours après 15s, aucun plantage détecté."
          Stop-Process -Id $proc.Id -Force

      # Étape 491 : le paquet du Microsoft Store, installé POUR DE VRAI puis lancé, comme l'installeur juste au-dessus.
      # Le paquet publié n'est pas signé (le Store le signe) ; Windows refuse d'installer un paquet non signé, donc la
      # copie de test est signée ici avec un certificat jetable au nom de l'éditeur. Vérifie aussi que l'identité tapée
      # dans electron-builder.yml est la bonne : le nom de famille du paquet (calculé par Windows à partir de l'éditeur)
      # doit être exactement celui affiché par l'Espace partenaires.
      - name: Vérifie que la version Microsoft Store s'installe et démarre
        shell: pwsh
        run: |
          $msix = Get-Item release\Jaris-Store-*.msix -ErrorAction SilentlyContinue
          if (-not $msix) { throw "Paquet Microsoft Store absent de release\" }
          $publisher = 'CN=32D80499-7B84-467E-9549-326C1D710140'
          $cert = New-SelfSignedCertificate -Type Custom -Subject $publisher -KeyUsage DigitalSignature -FriendlyName 'Jaris CI (test)' -CertStoreLocation 'Cert:\CurrentUser\My' -TextExtension @('2.5.29.37={text}1.3.6.1.5.5.7.3.3', '2.5.29.19={text}')
          $secret = ConvertTo-SecureString -String 'jaris-ci-test' -Force -AsPlainText
          Export-PfxCertificate -Cert $cert -FilePath "$env:RUNNER_TEMP\test.pfx" -Password $secret | Out-Null
          Export-Certificate -Cert $cert -FilePath "$env:RUNNER_TEMP\test.cer" | Out-Null
          Import-Certificate -FilePath "$env:RUNNER_TEMP\test.cer" -CertStoreLocation 'Cert:\LocalMachine\TrustedPeople' | Out-Null
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { throw "signtool introuvable sur la machine de la CI" }
          $copy = "$env:RUNNER_TEMP\Jaris-test.msix"
          Copy-Item $msix.FullName $copy
          & $signtool.FullName sign /fd SHA256 /f "$env:RUNNER_TEMP\test.pfx" /p jaris-ci-test $copy
          if ($LASTEXITCODE) { throw "Signature de test du paquet impossible" }
          # Comme sur un PC neuf : le test de l'installeur juste au-dessus a laissé son repère de stockage dans AppData
          # (Jaris installé sur D: ici), que la version Store relirait — elle reprend en effet les données d'un Jaris
          # déjà installé, ce qui est voulu chez Léo mais masquerait ici l'emplacement propre à la version Store.
          Remove-Item "$env:APPDATA\Jaris" -Recurse -Force -ErrorAction SilentlyContinue
          # Étape 496 : le cas de Léo — un ancien Jaris désinstallé dont le dossier D:\… a été effacé, mais qui a laissé
          # son repère dans AppData et une jonction vers ce dossier. La version Store annonçait « disque D: débranché ».
          New-Item -ItemType Directory -Force "$env:APPDATA\Jaris" | Out-Null
          Set-Content -Path "$env:APPDATA\Jaris\storage-location.json" -Value '{"root":"D:\\Jaris-efface"}' -Encoding utf8
          $deadLink = "$env:LOCALAPPDATA\Jaris\python-runtime"
          if (Test-Path $deadLink) { cmd /c rmdir /s /q "$deadLink" }
          New-Item -ItemType Directory -Force "$env:LOCALAPPDATA\Jaris", 'D:\Jaris-efface\python-runtime' | Out-Null
          cmd /c mklink /J "$deadLink" 'D:\Jaris-efface\python-runtime'
          if ($LASTEXITCODE) { throw "Jonction de test impossible" }
          Remove-Item 'D:\Jaris-efface' -Recurse -Force
          Add-AppxPackage -Path $copy
          $pkg = Get-AppxPackage -Name Moulard.Jaris
          if (-not $pkg) { throw "Le paquet ne s'est pas installé" }
          if ($pkg.PackageFamilyName -ne 'Moulard.Jaris_5g9va5hqem6jc') { throw "Identité différente de l'Espace partenaires : $($pkg.PackageFamilyName)" }
          # Étape 496 : l'icône sans fond (barre des tâches) est dans le paquet ET indexée (resources.pri), sinon Windows
          # l'ignore et peint sa couleur d'accent derrière le logo.
          if (-not (Test-Path "$($pkg.InstallLocation)\assets\Square44x44Logo.targetsize-48_altform-unplated.png")) { throw "Icône sans fond absente du paquet" }
          if (-not (Test-Path "$($pkg.InstallLocation)\resources.pri")) { throw "resources.pri absent : les icônes sans fond ne seraient pas trouvées par Windows" }
          Start-Process "shell:AppsFolder\$($pkg.PackageFamilyName)!Jaris"
          Start-Sleep -Seconds 20
          $proc = Get-Process -Name Jaris -ErrorAction SilentlyContinue | Where-Object { $_.Path -like '*WindowsApps*' }
          if (-not $proc) { throw "La version Store de Jaris ne tourne pas 20 s après son lancement : plantage au démarrage." }
          # La version Store range ses données hors d'AppData (sinon l'Explorateur ne les verrait pas) : preuve
          # que Jaris s'est reconnu comme version Store.
          if (-not (Test-Path "$env:USERPROFILE\Jaris")) { throw "Dossier $env:USERPROFILE\Jaris absent : Jaris ne s'est pas reconnu comme version Store (ou a cru le disque D: débranché à cause de l'ancien repère)." }
          # Étape 500 : la jonction morte de l'ancien Jaris (étape 496) ne gêne plus la version Store, qui installe ses
          # moteurs dans %USERPROFILE%\.jaris et n'utilise plus %LOCALAPPDATA%\Jaris (jarisLocalDir.ts).
          Write-Host "Version Store installée ($($pkg.PackageFullName)), lancée, toujours en marche après 20 s."
          # Étape 500 : dans le paquet, pip échouait chez Léo dans AppData (« [WinError 3] … INSTALLERxxxx.tmp ->
          # INSTALLER », Windows range à part les nouveaux fichiers d'AppData). Les moteurs de la version Store vont donc
          # dans %USERPROFILE%\.jaris. Preuve ici, DANS le contexte du paquet (Invoke-CommandInDesktopPackage) : un
          # environnement Python et un `pip install` dans AppData (informatif : montre le défaut), puis au nouvel
          # emplacement (doit réussir).
          $python = (Get-Command python -ErrorAction SilentlyContinue).Source
          $probeOut = "$env:RUNNER_TEMP\pip-probe"
          New-Item -ItemType Directory -Force $probeOut | Out-Null
          $probe = "$env:RUNNER_TEMP\pip-probe.cmd"
          Set-Content -Path $probe -Encoding ascii -Value @(
            '@echo off',
            "set OUT=$probeOut",
            'call :probe "%LOCALAPPDATA%\JarisProbe" old',
            'call :probe "%USERPROFILE%\.jaris-probe" new',
            'echo done> "%OUT%\done.txt"',
            'exit /b 0',
            ':probe',
            'set NAME=%~2',
            "`"$python`" -m venv `"%~1\venv`" > `"%OUT%\%NAME%.log`" 2>&1",
            '"%~1\venv\Scripts\python.exe" -m pip install --no-cache-dir flatbuffers==25.12.19 >> "%OUT%\%NAME%.log" 2>&1',
            '> "%OUT%\%NAME%.code" echo %ERRORLEVEL%',
            'exit /b 0'
          )
          $ran = $false
          if ($python) {
            try {
              Invoke-CommandInDesktopPackage -PackageFamilyName $pkg.PackageFamilyName -AppId Jaris -Command 'cmd.exe' -Args "/c `"$probe`"" -PreventBreakaway
              $ran = $true
            } catch {
              Write-Warning "Invoke-CommandInDesktopPackage indisponible ici : $($_.Exception.Message)"
            }
          } else { Write-Warning 'Python absent de la machine de la CI : essai de pip dans le paquet sauté.' }
          if ($ran) {
            $deadline = (Get-Date).AddMinutes(5)
            while (-not (Test-Path "$probeOut\done.txt") -and (Get-Date) -lt $deadline) { Start-Sleep -Seconds 3 }
            foreach ($name in 'old', 'new') {
              Write-Host "--- pip dans le paquet : $name ---"
              Get-Content "$probeOut\$name.log" -ErrorAction SilentlyContinue | Select-Object -Last 6 | ForEach-Object { Write-Host $_ }
            }
            if (-not (Test-Path "$probeOut\done.txt")) { throw "L'essai de pip dans le paquet n'a pas fini en 5 minutes." }
            $old = (Get-Content "$probeOut\old.code" -ErrorAction SilentlyContinue | Select-Object -First 1)
            $new = (Get-Content "$probeOut\new.code" -ErrorAction SilentlyContinue | Select-Object -First 1)
            Write-Host "pip dans AppData (ancien emplacement) : code $old ; dans %USERPROFILE%\.jaris (nouveau) : code $new"
            if ("$new".Trim() -ne '0') { throw "pip échoue aussi hors d'AppData dans le paquet (code $new) : le correctif de l'étape 500 ne suffit pas." }
          }
          $proc | Stop-Process -Force
          Start-Sleep -Seconds 2
          Remove-AppxPackage -Package $pkg.PackageFullName

      # Récupérable depuis l'onglet Actions de GitHub, sur chaque commit poussé : c'est le moyen le plus
      # rapide de tester une version en cours de développement sur un vrai PC Windows.
      - uses: actions/upload-artifact@v4
        with:
          name: Jaris-Setup
          path: |
            release/Jaris-Setup-*.exe
            release/Jaris-Store-*.msix
          if-no-files-found: error

      # Sur un tag de version : publie le .exe en Release nommée d'après le tag (ex: v0.1.0), une vraie
      # sortie versionnée avec ses notes.
      - if: startsWith(github.ref, 'refs/tags/v')
        run: |
          $exe = (Get-Item release/Jaris-Setup-*.exe).FullName
          $msix = (Get-Item release/Jaris-Store-*.msix).FullName
          gh release create "$env:GITHUB_REF_NAME" "$exe" "$msix" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}

      # Sur chaque push de branche (pas les tags, déjà couverts ci-dessus) : republie systématiquement une
      # Release "dernier-build", écrasée à chaque fois (--clobber). Contrairement à un artefact (.zip, lien
      # qui change à chaque run), ça donne un lien de téléchargement STABLE et direct vers le .exe, sans
      # jamais avoir à créer un tag à la main pour tester une version en cours de développement.
      - if: github.ref_type == 'branch'
        run: |
          $exe = (Get-Item release/Jaris-Setup-*.exe).FullName
          $msix = (Get-Item release/Jaris-Store-*.msix).FullName
          gh release delete dernier-build --yes 2>$null
          gh release create dernier-build "$exe" "$msix" --title "Dernier build (${env:GITHUB_REF_NAME})" --notes "Construit automatiquement depuis le commit ${env:GITHUB_SHA} — pas une version stable, remplacé à chaque push." --prerelease
        env:
          GH_TOKEN: ${{ github.token }}

      # Publie automatiquement une VRAIE Release stable dès que le champ `version` de package.json ne
      # correspond à aucune Release déjà publiée — personne, pas même le développeur, ne tape jamais
      # `git tag` à la main (un push de tag reste possible ci-dessus, mais n'est plus nécessaire) : bumper
      # `version` dans package.json puis pousser suffit, sur n'importe quelle branche. Idempotent : si la
      # Release existe déjà (ex: un deuxième commit sans changement de version), `gh release view` réussit
      # et on ne fait rien.
      - if: github.ref_type == 'branch'
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $tag = "v$version"
          $exe = (Get-Item release/Jaris-Setup-*.exe).FullName
          # Étape 491 : le paquet du Microsoft Store, joint à la Release pour que Léo le dépose dans l'Espace partenaires.
          $msix = (Get-Item release/Jaris-Store-*.msix).FullName
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag déjà publiée, rien à faire."
          } else {
            gh release create $tag "$exe" "$msix" --title $tag --generate-notes --target $env:GITHUB_SHA
          }
        env:
          GH_TOKEN: ${{ github.token }}
