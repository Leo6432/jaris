<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#01040a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Jaris" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Jaris</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="stylesheet" href="/app.css" />
  </head>
  <body>
    <!-- Appairage : affiché tant que ce téléphone n'a pas de jeton (ou s'il a été déconnecté depuis le PC). -->
    <main id="pair" class="pair" hidden>
      <img class="orb orb--big" src="/logo.png" alt="" aria-hidden="true" />
      <h1>Jaris</h1>
      <p class="pair__lead">Connecte ce téléphone à ton Jaris.</p>
      <p class="pair__hint">Sur ton PC : <strong>Options → Téléphone → Connecter un téléphone</strong>, puis tape le code affiché.</p>
      <form id="pair-form" class="pair__form" autocomplete="off">
        <input id="pair-code" class="pair__code" inputmode="numeric" pattern="[0-9 ]*" maxlength="9" placeholder="12345678" aria-label="Code à 8 chiffres" />
        <button id="pair-submit" class="button" type="submit">Connecter</button>
      </form>
      <p id="pair-error" class="error" role="alert" hidden></p>
    </main>

    <!-- Conversation : la même que le Chat de Jaris sur le PC. -->
    <section id="chat" class="chat" hidden>
      <header class="chat__header">
        <img class="orb" src="/logo.png" alt="" aria-hidden="true" />
        <div class="chat__title">
          <span class="chat__name">Jaris</span>
          <span id="chat-status" class="chat__status">Connecté à ton PC</span>
        </div>
      </header>
      <ol id="messages" class="messages" aria-live="polite"></ol>
      <form id="composer" class="composer" autocomplete="off">
        <textarea id="input" class="composer__input" rows="1" placeholder="Écris à Jaris…" aria-label="Message"></textarea>
        <button id="mic" class="composer__mic" type="button" aria-label="Message vocal" title="Message vocal">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M12 15a3 3 0 0 0 3-3V6a3 3 0 1 0-6 0v6a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-2.08A7 7 0 0 0 19 12h-2Z"/></svg>
        </button>
        <button id="send" class="composer__send" type="submit" aria-label="Envoyer" title="Envoyer">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M12 4 5 11l1.4 1.4L11 7.8V20h2V7.8l4.6 4.6L19 11z"/></svg>
        </button>
      </form>
      <div id="recording" class="recording" hidden>
        <span class="recording__dot" aria-hidden="true"></span>
        <span id="recording-time">0:00</span>
        <button id="recording-cancel" class="recording__cancel" type="button">Annuler</button>
        <button id="recording-send" class="button" type="button">Envoyer</button>
      </div>
    </section>
    <script src="/app.js"></script>
  </body>
</html>
